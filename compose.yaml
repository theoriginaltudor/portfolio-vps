services:
  postgres:
    image: ankane/pgvector:latest
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  aspnet-api:
    build:
      context: .
      dockerfile: aspnet-api/Dockerfile
    container_name: aspnet_api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_URLS: "http://+:5000;http://+:3000;http://+:8000"
      ConnectionStrings__DefaultConnection: "Host=postgres; Port=5432; Database=${POSTGRES_DB}; Username=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${Jwt__Key}
      Jwt__RefreshKey: ${Jwt__RefreshKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__AccessTokenExpirationMinutes: ${Jwt__AccessTokenExpirationMinutes}
      Jwt__RefreshTokenExpirationDays: ${Jwt__RefreshTokenExpirationDays}
    restart: always
    volumes:
      - ./aspnet-api/images:/app/images
    user: "1654:1654"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    networks:
      default: {}
      shared_net:
        aliases:
          - api
          - frontend


volumes:
  pg_data:

networks:
  shared_net:
    external: true
