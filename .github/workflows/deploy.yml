name: Deploy to VPS

on:
  push:
    branches: [main] # Adjust branch name if needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'react-app/.env' \
            --exclude 'react-app/node_modules/' \
            --exclude 'react-app/dist/' \
            --exclude 'react-app/package-lock.json' \
            --exclude 'aspnet-api/images' \
            --exclude 'aspnet-api/PortfolioBack/bin/' \
            --exclude 'aspnet-api/PortfolioBack/obj/' \
            --exclude 'aspnet-api/PortfolioBack/*.dll' \
            .dockerignore compose.yaml portfolio-vps.sln \
            aspnet-api react-app \
            ${{ vars.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_PATH }}

      - name: Execute remote commands
        run: |
          ssh ${{ vars.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ vars.DEPLOY_PATH }}
            # Create .env file
            echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}" > .env
            echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "Jwt__Key=${{ secrets.JWTKEY }}" >> .env
            echo "Jwt__RefreshKey=${{ secrets.JWTKEY }}" >> .env
            echo "Jwt__Issuer=https://${{ vars.HOST_SITE }}" >> .env
            echo "Jwt__Audience=portfolio-api" >> .env
            echo "Jwt__AccessTokenExpirationMinutes=15" >> .env
            echo "Jwt__RefreshTokenExpirationDays=7" >> .env
            sudo docker compose -f compose.yaml down --remove-orphans
            sudo docker compose -f compose.yaml up --build --remove-orphans -d
          EOF
